[pytest]
# Pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# 测试路径
testpaths = tests

# 输出选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    # --cov=.
    # --cov-report=html
    # --cov-report=term-missing

# 标记定义
markers =
    integration: 集成测试
    unit: 单元测试
    slow: 慢速测试
    knowledge: 知识库测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小版本
minversion = 7.0
